<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SecureFlow{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f6f7f9; }
        .navbar-brand { font-weight: 600; letter-spacing: .3px; }
        .card-scan { transition: box-shadow .15s ease; }
        .card-scan:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/ui/scans">
            <i class="bi bi-shield-check"></i> SecureFlow
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
            {% if user %}
                <span class="text-light small">
                    <i class="bi bi-person-circle"></i>
                    {{ user.email }}
                    <span class="badge bg-secondary ms-1">{{ user.role.value }}</span>
                </span>
                <a class="btn btn-sm btn-outline-light" href="/ui/logout">
                    <i class="bi bi-box-arrow-right"></i> Выйти
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted small my-5">
    SecureFlow · Vulnerability Management Platform
</footer>
</body>
</html>
