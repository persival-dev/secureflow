<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SecureFlow{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script>
        // Ставим тему ДО рендера — иначе будет вспышка белым.
        (function () {
            const saved = localStorage.getItem('sf-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <style>
        /* Плавное переключение фона/текста при смене темы */
        html, body {
            transition: background-color .15s ease, color .15s ease;
        }
        /* Навбар и карточки тоже — иначе переключаются рывком */
        .navbar, .card, .table, .alert, .badge {
            transition: background-color .15s ease, color .15s ease, border-color .15s ease;
        }
        .navbar-brand { font-weight: 600; letter-spacing: .3px; }
        .card-scan { transition: box-shadow .15s ease, background-color .15s ease; }
        .card-scan:hover { box-shadow: 0 4px 12px rgba(0,0,0,.15); }

        /* Пульс для критичных уязвимостей */
        @keyframes pulse-critical {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            50%      { box-shadow: 0 0 0 6px rgba(220, 53, 69, 0); }
        }
        .badge-critical {
            animation: pulse-critical 2s ease-in-out infinite;
        }

        /* Каскадное появление карточек при загрузке */
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in-card {
            animation: fade-in-up .3s ease-out both;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/ui/scans">
            <i class="bi bi-shield-check"></i> SecureFlow
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            {% if user %}
                <span class="text-white small d-none d-sm-inline">
                    <i class="bi bi-person-circle"></i>
                    {{ user.email }}
                    <span class="badge bg-secondary ms-1">{{ user.role.value }}</span>
                </span>
            {% endif %}

            <button class="btn btn-sm btn-outline-light" id="theme-toggle"
                    type="button" title="Сменить тему">
                <i class="bi bi-moon-stars" id="theme-icon"></i>
                <span class="d-none d-md-inline ms-1" id="theme-label">Тёмная</span>
            </button>

            {% if user %}
                <a class="btn btn-sm btn-outline-light" href="/ui/logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="d-none d-md-inline ms-1">Выйти</span>
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted small my-5">
    SecureFlow · Vulnerability Management Platform
</footer>

<script>
    (function () {
        const html = document.documentElement;
        const btn = document.getElementById('theme-toggle');
        const icon = document.getElementById('theme-icon');
        const label = document.getElementById('theme-label');

        function syncUI() {
            const isDark = html.getAttribute('data-bs-theme') === 'dark';
            // Иконка показывает, что БУДЕТ после клика:
            // сейчас тёмная → кнопка «Светлая» с иконкой солнца
            icon.className = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-stars';
            label.textContent = isDark ? 'Светлая' : 'Тёмная';
        }

        syncUI();

        btn.addEventListener('click', function () {
            const isDark = html.getAttribute('data-bs-theme') === 'dark';
            const next = isDark ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', next);
            localStorage.setItem('sf-theme', next);
            syncUI();
        });
    })();
</script>
</body>
</html>
