# ============================================================
# Override для ЛОКАЛЬНОЙ разработки.
# Автоматически применяется при `docker compose up`.
# В prod: `docker compose -f docker-compose.yml up`.
# ============================================================

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  api:
    environment:
      DEBUG: "true"
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      - ./tests:/app/tests:ro
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app