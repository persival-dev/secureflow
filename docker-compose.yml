# ============================================================
# SecureFlow — базовый docker-compose (prod-подобный)
# Порты БД/Redis НЕ публикуются. Для dev — override-файл.
# api и worker используют ОДИН образ (secureflow:latest).
# ============================================================

name: secureflow

services:
  # ---------- PostgreSQL 16 ----------
  postgres:
    image: postgres:16-alpine
    container_name: secureflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - secureflow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: secureflow-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save ""
    volumes:
      - redis_data:/data
    networks:
      - secureflow_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 384M

  # ---------- FastAPI ----------
  # build только здесь — Docker соберёт ОДИН образ, worker его переиспользует.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: secureflow:latest
    container_name: secureflow-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secureflow_net

  # ---------- Celery Worker ----------
  # image: secureflow:latest — берём тот же образ, что api.
  # build НЕ указываем: Docker не будет собирать второй образ.
  worker:
    image: secureflow:latest
    container_name: secureflow-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secureflow_net
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=INFO
      --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  secureflow_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local