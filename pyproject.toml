[project]
name = "secureflow"
version = "0.1.0"
description = "Vulnerability Management Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "bcrypt>=4.2.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "jinja2>=3.1.0",
    "bandit>=1.7.10",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
scanner = [
    "semgrep>=1.95.0",
]
reports = [
    "weasyprint>=62.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
]

ignore = [
    "B008",
    "UP046",
    "SIM117",
    "BLE001",
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]
"alembic/versions/*.py" = ["E501", "I001", "N999", "UP007"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]